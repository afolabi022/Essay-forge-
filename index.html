<style>
:root{--bg:#7560a8;--tx:#fff;--tm:#f3eeff;--sf:#fffaf2;--ink:#1d1238;--mut:#665b86;--ln:#cfc3f0;--red:#d93a35;--ok:#1f8f57;--hl:#ffe3b8;--sky:#8fdcff;--lav:#b39dfc;--or:#fdb468;--disp:"Arial Black","Avenir Next Heavy","Segoe UI Black",Impact,system-ui,sans-serif;--scr:"Snell Roundhand","Brush Script MT","Segoe Script","Lucida Handwriting",cursive;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:740px;margin:0 auto;padding:18px 16px 70px}
h1{font:900 2.6rem/1 var(--disp);margin:0;color:#fff;letter-spacing:-.01em}
h1 .s{display:block;font:700 2.2rem/1 var(--scr);color:var(--lav);margin-bottom:-.3rem;transform:rotate(-3deg);transform-origin:left bottom}
h2{font:900 1.35rem/1.15 var(--disp);margin:24px 0 4px}
.mut{color:var(--tm)}.sm{font-size:.88rem}
.card .mut,.q .mut,.fb .mut{color:var(--mut)}
.bar{display:flex;gap:10px;align-items:center;margin:14px 0 8px;font-size:.85rem;font-weight:700}
.xp{flex:1;height:12px;background:rgba(255,255,255,.28);border-radius:9px;overflow:hidden}.xp i{display:block;height:100%;background:var(--or);transition:width .4s;border-radius:9px}
.chip{display:inline-block;padding:3px 10px;border:1.5px solid #fff;border-radius:99px;font-weight:800;font-size:.76rem;margin:2px 4px 2px 0;color:#fff}.chip.off{opacity:.5;border-style:dashed}.chip.on{background:var(--or);color:var(--ink);border-color:var(--ink)}
.card .chip{color:var(--ink);border-color:var(--ink)}
.grid{display:grid;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
.m{width:100%;text-align:left;background:var(--sky);color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:14px 16px;box-shadow:4px 4px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.grid .m:nth-child(3n+2){background:var(--lav)}.grid .m:nth-child(3n){background:var(--or)}
.m:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #fff}
.m b{display:block;font:900 1.05rem/1.25 var(--disp)}.m .t{float:right;font-weight:800;color:var(--ink)}.m .mut{color:#3a2d62}
.btn{font-weight:800;background:var(--ink);color:#fff;border:2px solid var(--ink);border-radius:99px;padding:10px 18px}.btn.g{background:none;color:#fff;border-color:#fff}.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.slot{display:flex;gap:10px;padding:10px 12px;border:2px dashed var(--ln);border-radius:14px;margin:8px 0;min-height:54px;background:var(--sf);color:var(--ink)}
.slot .n{font-weight:900;color:var(--red);min-width:1.3rem}.slot small{display:block;color:var(--mut);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
.slot.ok{border:2px solid var(--ok)}.slot.no{border:2px solid var(--red);background:color-mix(in srgb,var(--red) 12%,var(--sf))}
.pick{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:2px solid var(--ink);border-radius:14px;background:var(--hl);color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.pick:disabled{cursor:default;box-shadow:none}
.pick.bad{background:color-mix(in srgb,var(--red) 22%,var(--sf));border-color:var(--red)}
.pick.mine{outline:3px dashed var(--or);outline-offset:2px}
.pick.fine{background:var(--sf)}
.fb{margin-top:14px;padding:12px 14px;border-left:6px solid var(--red);border-radius:0 14px 14px 0;background:var(--sf);color:var(--ink)}.fb.ok{border-color:var(--ok)}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.roles button,.ch{padding:11px 10px;border:2px solid var(--ink);border-radius:14px;background:var(--sf);color:var(--ink);font-weight:700}
button.sel{background:var(--hl);outline:3px solid var(--or)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.no{background:var(--red);color:#fff;border-color:var(--red)}
.q{font-size:1.08rem;line-height:1.5;padding:16px;background:var(--sf);color:var(--ink);border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink)}
textarea{width:100%;min-height:96px;padding:10px;border:2px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--ink);font:inherit;resize:vertical}textarea:focus{outline:3px solid var(--or)}
label{display:block;margin:16px 0 4px;font-weight:800;font-size:.85rem}label span{font-weight:400;color:var(--tm)}
.ck{font-size:.9rem;margin:6px 0;padding:7px 12px;border-radius:12px;background:var(--sf);color:var(--ink);border-left:6px solid var(--ln)}.ck.y{border-left-color:var(--ok)}.ck.n{border-left-color:var(--red)}
.cn{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;font-size:.85rem;border-bottom:2px solid rgba(255,255,255,.3)}
.ch{display:inline-block;margin:3px 4px 3px 0;padding:5px 12px;border-radius:99px;font-size:.8rem}
.card{background:var(--sf);color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:16px;box-shadow:4px 4px 0 var(--ink)}
.big{font-size:1.1rem;line-height:1.55;margin:6px 0}
.stp{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.stp i{font:900 1.5rem var(--disp);font-style:normal;background:var(--or);border:2px solid var(--ink);border-radius:50%;width:46px;height:46px;display:grid;place-items:center;flex:none}
.stp b{font:900 1.15rem/1.2 var(--disp);display:block}.stp small{color:var(--mut)}
.mk{background:var(--or);color:var(--ink);padding:0 4px;border-radius:5px;font-weight:800}
.dg{display:flex;flex-direction:column;align-items:center;gap:2px}
.dr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.db{flex:1 1 130px;max-width:280px;padding:10px;background:var(--sky);border:2px solid var(--ink);border-radius:14px;text-align:center;color:var(--ink)}
.dg .dr:nth-of-type(2n) .db{background:var(--lav)}.dg .dr:nth-of-type(3n) .db{background:var(--or)}
.db small{display:block;font-size:.74rem;color:#3a2d62}
.ar{font-size:1.3rem;font-weight:900;color:var(--ink);line-height:1}
.cele{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 18px;border-radius:16px;margin-top:14px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);color:var(--ink)}
.cele .s{font:700 1.8rem var(--scr);color:#5a3fc9}.cele .s.cap{font:800 .72rem system-ui,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:var(--ink)}
.cele b{font:900 2.3rem/1 var(--disp);color:#fff;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.c-sky{background:var(--sky)}.c-lav{background:var(--lav)}.c-or{background:var(--or)}
.slipbox{display:flex;gap:12px;align-items:flex-end;margin:12px 0}
.slip{flex:none}
.bub{position:relative;background:var(--sf);color:var(--ink);border:2px solid var(--ink);border-radius:16px;padding:10px 14px;flex:1;font-weight:600}
.bub:before{content:"";position:absolute;left:-10px;bottom:18px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.stars{font-size:1.6rem;color:#e07a10;letter-spacing:.1em}
</style></head><body><main id="app"></main>

{t:'Using linking words',l:['“Moreover” signals a contrast with the last point.','“However” signals a contrast.','“Therefore” signals a result.','“For example” introduces evidence.'],b:0,w:'“Moreover” adds more in the same direction. “However” is the contrast word.',f:'Use “however” for contrast and “moreover” to add.'},
