<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Essay Forge</title>
<style>
:root{--bg:#f6f1e4;--sf:#fffdf6;--ink:#1c2340;--mut:#6b6f85;--ln:#d9d1bb;--red:#c8302c;--ok:#2f7d4f;--hl:#fbe9a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14172a;--sf:#1d2140;--ink:#f2eedf;--mut:#a3a7c2;--ln:#343a63;--red:#ff6b64;--ok:#6fd09a;--hl:#4a4320}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14172a;--sf:#1d2140;--ink:#f2eedf;--mut:#a3a7c2;--ln:#343a63;--red:#ff6b64;--ok:#6fd09a;--hl:#4a4320}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Iowan Old Style",Georgia,serif}
main{max-width:740px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:2.3rem;line-height:1.05;margin:0}h1 em{color:var(--red);font-style:normal;text-decoration:underline wavy;text-underline-offset:6px}
h2{font-size:1.3rem;margin:18px 0 4px}.mut{color:var(--mut)}.sm{font-size:.88rem}
.ui,.bar,.chip,.btn,label,.ck,.cn,.roles button,.slot small{font-family:system-ui,sans-serif}
.bar{display:flex;gap:10px;align-items:center;margin:14px 0 8px;font-size:.85rem}
.xp{flex:1;height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.xp i{display:block;height:100%;background:var(--red);transition:width .4s}
.chip{display:inline-block;padding:3px 10px;border:1.5px solid var(--ink);border-radius:99px;font-weight:700;font-size:.78rem;margin:2px 4px 2px 0}.chip.off{opacity:.3;border-style:dashed}.chip.on{background:var(--hl)}
.grid{display:grid;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
.m{width:100%;text-align:left;background:var(--sf);border:1.5px solid var(--ink);border-radius:6px;padding:14px;box-shadow:4px 4px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.m:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--red)}.m b{display:block;font-size:1.1rem}.m .t{float:right;font-family:system-ui,sans-serif;font-weight:700;color:var(--ok)}
.btn{font-weight:700;background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:10px 16px}.btn.g{background:none;color:var(--ink);border:1.5px solid var(--ink)}.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.slot{display:flex;gap:10px;padding:10px 12px;border:1.5px dashed var(--ln);border-radius:6px;margin:8px 0;min-height:54px;background:var(--sf)}
.slot .n{font-family:system-ui,sans-serif;font-weight:800;color:var(--red);min-width:1.3rem}.slot small{display:block;color:var(--mut);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
.slot.ok{border:1.5px solid var(--ok)}.slot.no{border:1.5px solid var(--red);background:color-mix(in srgb,var(--red) 10%,var(--sf))}
.pick{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1.5px solid var(--ink);border-radius:6px;background:var(--hl)}
.fb{margin-top:14px;padding:12px 14px;border-left:5px solid var(--red);background:var(--sf)}.fb.ok{border-color:var(--ok)}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.roles button{padding:11px 8px;border:1.5px solid var(--ink);border-radius:6px;background:var(--sf);font-weight:600}.roles button.sel{background:var(--hl)}
.roles button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.roles button.no{background:var(--red);color:#fff;border-color:var(--red)}
.q{font-size:1.1rem;line-height:1.45;padding:16px;background:var(--sf);border:1.5px solid var(--ln);border-radius:6px}
textarea{width:100%;min-height:96px;padding:10px;border:1.5px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--ink);font:inherit;resize:vertical}textarea:focus{outline:2px solid var(--red)}
label{display:block;margin:16px 0 4px;font-weight:700;font-size:.85rem}label span{font-weight:400;color:var(--mut)}
.ck{font-size:.88rem;margin:4px 0}.ck.y{color:var(--ok)}.ck.n{color:var(--red)}
.cn{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;font-size:.85rem;border-bottom:1.5px solid var(--ln)}
.ch{display:inline-block;margin:3px 4px 3px 0;padding:5px 10px;border:1.5px solid var(--ink);border-radius:99px;background:var(--sf);font-family:system-ui,sans-serif;font-size:.8rem}
</style></head><body><main id="app"></main>

{t:'Why KPMG and your division',c:'Values',cmd:'Explain',u:'w',n:300,x:500,q:'Why have you chosen to apply to KPMG over other professional services firms? Specifically explain how your academic background, skill set, and long-term career aspirations align with the work done in your preferred division (Audit, Tax, or Advisory).',pts:[['Why KPMG over others','KPMG|firm|culture|values|reputation','A specific value, programme or client work'],['Your background and skills','degree|engineer|skill|academic|experience|project','Link your degree and a project to the work'],['Division and long-term fit','audit|tax|advisory|career|long-term|aspir','Where the division takes you in 5 years']],ex:['Name one KPMG value and what it means to you','Link your degree to the division','Use one project as proof of skill','Your ITGC reviews and AI builds']},

{t:'Ethical courage and integrity',c:'Behavioural',cmd:'Describe',u:'c',n:5500,st:1,q:'Professional integrity is central to KPMG’s work (“Above all, we act with integrity”). Describe a scenario in your academic, professional, or extra-curricular experience where you were pressured to compromise your standards, cut corners, or ignore an ethical breach. What guided your decision, how did you handle the situation, and what was the outcome?'},

var STF=[['Situation','Set the scene: where, when, who, what was at stake.'],['Your role and the stakes','What were you responsible for, and what could go wrong?'],['What you did, step by step','Use “I”. Name each action, the reason for it, and what guided you.'],['The result','What happened? Use numbers, outcomes and what others said.'],['Lesson and principle','What did you learn, and what do you do differently now?']];

function sav(){try{localStorage.setItem('ef2',JSON.stringify(S))}catch(e){}}
function add(n){S.xp+=n;sav()}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

var $=function(s){return document.querySelector(s)},app=$('#app'),G={},TM=0;
var TT=['Rough draft','Sharp pencil','Clean copy','Tight prose','Senior editor','Master writer'];

var BD=[['Intro Architect',function(){return S.done.o0}],['Paragraph Pro',function(){return S.done.o2}],['Essay Mapper',function(){return S.done.o4}],['Story Teller',function(){return S.done.o5}],['Role Master',function(){return S.done.lab}],['Draft Doctor',function(){return S.done.fix}],['Prompt Decoder',function(){return Object.keys(S.dec).length>=3}],['Essayist',function(){return nB()>=1}],['Marathoner',function(){return nB()>=4}]];

+'<button class="m" data-a="o0"><span class="t">'+d('o0')+'</span><b>Build the introduction</b><span class="mut sm">3 steps: background, rewrite, thesis.</span></button>'
+'<button class="m" data-a="o2"><span class="t">'+d('o2')+'</span><b>Build a body paragraph</b><span class="mut sm">4 steps: topic, reason, reason, summary.</span></button>'

else{var need=p.st?4:p.pts.length;if(!G.opts)G.opts=p.st?shuf(['A real situation with stakes','Your personal actions in the first person','What guided your decision','A clear outcome and lesson','A list of KPMG offices','Your salary expectations']):shuf(p.pts.map(function(x){return x[0]}).concat(shuf(DEC).slice(0,3)));

show(h)}
function isReq(p,o){return p.st?(o.indexOf('KPMG offices')<0&&o.indexOf('salary')<0):p.pts.some(function(x){return x[0]===o})}
function dc(){var p=P[G.i],s=G.sel.map(function(k){return G.opts[k]}),ok=s.every(function(o){return isReq(p,o)});G.res=ok?'ok':'no';if(ok&&!S.dec[G.i]){S.dec[G.i]=1;add(15)}decR()}
function ord(i){G={i:i,pool:shuf(ORD[i].s.map(function(_,k){return k})),pick:[],tries:0,res:null};ordR()}
function ordR(){var d=ORD[G.i],h=head()+'<h2>'+d.n+'</h2><p class="mut sm">Tap the sentences in the right order. Tap a placed sentence to take it back.</p>';
d.st.forEach(function(st,k){var p=G.pick[k],c=G.res?(p===k?' ok':' no'):'';h+='<div class="slot'+c+'" data-s="'+k+'"><span class="n">'+(k+1)+'</span><div><small>'+st+'</small>'+(p!=null?esc(d.s[p]):'')+'</div></div>'});
G.pool.forEach(function(k){if(G.pick.indexOf(k)<0)h+='<button class="pick" data-p="'+k+'">'+esc(d.s[k])+'</button>'});
if(G.res==='ok')h+='<div class="fb ok"><b>Correct.</b> '+(G.tries?'Got it on try '+(G.tries+1)+'.':'First try!')+'</div><div class="row"><button class="btn" data-a="'+d.k+'">Another one</button><button class="btn g" data-a="home">Back</button></div>';
else{if(G.res)h+='<div class="fb">Not quite. The red slots are out of place. Ask what job each sentence does.</div>';h+='<div class="row"><button class="btn" data-a="chk"'+(G.pick.length<d.s.length?' disabled':'')+'>Check</button><button class="btn g" data-a="home">Back</button></div>'}
show(h)}
function chk(){var ok=G.pick.every(function(p,k){return p===k});if(ok){G.res='ok';add(G.tries?10:20);S.done[ORD[G.i].k]=1;sav()}else{G.tries++;G.res='no'}ordR()}
var QZ={sp:{it:LAB,o:ROLES,h:HINT,n:10,key:'lab',t:'Role sprint'},fx:{it:FIX,o:FIXK,h:FIXH,n:6,key:'fix',t:'Draft doctor'}};
function qz(m){var z=QZ[m];G={m:m,q:shuf(z.it).slice(0,z.n),k:0,sc:0,st:0,ans:null};qzR()}
function qzR(){var z=QZ[G.m];if(G.k>=z.n){add(G.sc*4);S.done[z.key]=1;sav();show(head()+'<h2>'+z.t+' complete</h2><div class="fb ok">You got '+G.sc+' of '+z.n+' right. +'+G.sc*4+' XP</div><div class="row"><button class="btn" data-a="'+G.m+'">Play again</button><button class="btn g" data-a="home">Back</button></div>');return}
var q=G.q[G.k],h=head()+'<p class="mut sm">Round '+(G.k+1)+' of '+z.n+' · streak '+G.st+'</p><div class="q">'+esc(q[0])+'</div><p class="sm mut">'+(G.m==='sp'?'What job does this sentence do?':'What is wrong with this paragraph?')+'</p><div class="roles">';
Object.keys(z.o).forEach(function(r){var c='';if(G.ans){if(r===q[1])c=' ok';else if(r===G.ans)c=' no'}h+='<button class="'+c+'" data-r="'+r+'"'+(G.ans?' disabled':'')+'>'+z.o[r]+'</button>'});
h+='</div>';if(G.ans)h+='<div class="fb'+(G.ans===q[1]?' ok':'')+'"><b>'+z.o[q[1]]+'.</b> '+z.h[q[1]]+'</div><div class="row"><button class="btn" data-a="nx">Next</button></div>';show(h)}
function flds(p){return p.st?STF.map(function(f){return[f[0],f[1]]}):[['Background statement','A broad sentence that sets the scene.'],['The question in your own words','Rewrite the prompt. Do not copy it.'],['Thesis statement','Your answer, with your main reasons.']].concat(p.pts.map(function(x,k){return['Body '+(k+1)+' · '+x[0],'Topic sentence, a reason or example, another reason or example, a summary. Idea: '+x[2]]})).concat([['Conclusion','Restate your thesis and main points. Add nothing new.']])}
function st(i,timed){var p=P[i],f=flds(p),d=S.dr[i]||[];G={i:i,f:null};var tl=p.u==='w'?'words':'characters';
show('<h1 style="font-size:1.5rem">'+p.t+'</h1><div class="q sm">'+esc(p.q)+'</div><div class="cn"><span id="cnt"></span> <button class="btn g" style="padding:4px 10px" id="tmb" data-a="tm">Start 25:00 timer</button> <b id="tmr"></b><div class="xp" style="margin-top:6px"><i id="cb" style="width:0"></i></div></div>'
+(p.ex?'<p class="sm mut" style="margin-bottom:0">Idea bank. Tap to add to the box you are writing in:</p><div>'+p.ex.map(function(x,k){return'<button class="ch" data-a="ch" data-k="'+k+'">'+esc(x)+'</button>'}).join('')+'</div>':'')
+f.map(function(x,k){return'<label>'+(k+1)+' · '+esc(x[0])+'<br><span>'+esc(x[1])+'</span></label><textarea id="f'+k+'" data-k="'+k+'" style="min-height:'+(p.st?150:100)+'px">'+esc(d[k]||'')+'</textarea>'}).join('')
+'<div class="row"><button class="btn" data-a="sc">Check my draft</button><button class="btn g" data-a="cp">Copy essay</button><button class="btn g" data-a="pr" data-i="'+i+'">Back</button></div><div id="fo"></div>');upd();if(timed)tm()}
function vals(p){return flds(p).map(function(_,k){var e=$('#f'+k);return e?e.value:''})}
function tot(p,v){var a=v.join(' ');return p.u==='w'?wc(a):a.length}
function upd(){var p=P[G.i],n=tot(p,vals(p)),c=$('#cnt');if(!c)return;c.textContent=n.toLocaleString('en-GB')+' / '+p.n.toLocaleString('en-GB')+(p.x?'–'+p.x:'+')+(p.u==='w'?' words':' characters');$('#cb').style.width=Math.min(100,n/p.n*100)+'%'}
function tm(){var b=$('#tmb'),el=$('#tmr');if(!b)return;clearInterval(TM);var e=Date.now()+25*60000;b.textContent='Restart timer';TM=setInterval(function(){var s=Math.max(0,Math.round((e-Date.now())/1000));el.textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2);el.style.color=s<300?'var(--red)':'inherit';if(!s){clearInterval(TM);el.textContent='Time’s up. Finish your sentence.'}},500)}
function cnt(re,t){return(t.match(re)||[]).length}
function scr(p,v){var u=p.u==='w'?'words':'characters',n=tot(p,v),cs=[[n>=p.n,'Length: at least '+p.n.toLocaleString('en-GB')+' '+u+' (you have '+n.toLocaleString('en-GB')+')']];if(p.x)cs.push([n<=p.x,'Stay within '+p.x+' '+u]);
if(p.st){cs.push([v[0].length>=300,'Situation: at least 300 characters of clear scene-setting'],[v[1].length>=200,'Your role and the stakes are explained (200+ characters)'],[v[2].length>=500&&cnt(/\bI\b/g,v[2])>=6,'Action is detailed and in the first person (500+ characters, 6+ uses of “I”)'],[v[3].length>=200&&/\d|result|outcome|as a result|eventually|finally|praise/i.test(v[3]),'Result gives a concrete outcome'],[v[4].length>=200&&/learn|lesson|now i|since then|principle|value/i.test(v[4]),'Lesson shows what you learned and now do differently']);return cs}
var a=v.join(' ').toLowerCase(),pq=p.q.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' '),w=v[1].toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean),cp=false;
for(var i=0;i+5<=w.length;i++){if(pq.indexOf(w.slice(i,i+5).join(' '))>-1)cp=true}
cs.push([wc(v[0])>=8,'Background has at least 8 words'],[wc(v[1])>=10&&!cp,'Rewrite is in your own words (10+ words, no 5-word run copied)'],[wc(v[2])>=12&&/because|by |through|since|so that/.test(' '+v[2].toLowerCase()+' '),'Thesis (12+ words) gives your answer and a reason']);
p.pts.forEach(function(x,k){var b=v[3+k],miss=[];if(!new RegExp(x[1],'i').test(b))miss.push('cover '+x[0].toLowerCase());if((b.match(/[.!?](\s|$)/g)||[]).length<4)miss.push('4+ sentences');if(!/for example|for instance|such as|e\.g|\d/i.test(b))miss.push('an example');cs.push([!miss.length,'Body '+(k+1)+' · '+x[0]+(miss.length?'. Needs: '+miss.join(', '):'')])});
cs.push([wc(v[v.length-1])>=25&&/conclusion|overall|in short|therefore|thus|to sum/i.test(v[v.length-1]),'Conclusion (25+ words) restates the thesis with a closing signal']);
var L=['however','therefore','moreover','furthermore','in addition','consequently','for example','as a result','in contrast','overall'].filter(function(x){return a.indexOf(x)>-1}).length;cs.push([L>=4,'Linking words: use at least 4 different ones (you used '+L+')']);return cs}
function sc(){var p=P[G.i],cs=scr(p,vals(p)),n=cs.filter(function(x){return x[0]}).length,h='';cs.forEach(function(x){h+='<div class="ck '+(x[0]?'y':'n')+'">'+(x[0]?'✓ ':'✗ ')+esc(x[1])+'</div>'});
var b=S.best[G.i]||0,g=Math.max(0,n-b)*5+(n===cs.length&&b<cs.length?30:0);if(n>b){S.best[G.i]=n}if(g)add(g);sav();
h+='<div class="fb'+(n===cs.length?' ok':'')+'"><b>'+n+' of '+cs.length+' checks passed.'+(g?' +'+g+' XP':'')+'</b> '+(n===cs.length?'Strong draft. Copy it and paste it to Claude for a detailed mark.':'Fix the red lines and check again. These checks look at structure and coverage, not the quality of your ideas.')+'</div>';$('#fo').innerHTML=h;$('#fo').scrollIntoView({behavior:'smooth'})}
function cpy(){var p=P[G.i],t=vals(p).join('\n\n'),ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');$('#fo').innerHTML='<div class="fb ok">Copied. Paste it into your chat with Claude for feedback.</div>'}catch(e){$('#fo').innerHTML='<div class="fb">Copy failed. Select the text in each box and copy it by hand.</div>'}ta.remove()}
app.addEventListener('input',function(e){var t=e.target;if(t.tagName==='TEXTAREA'){var p=P[G.i];S.dr[G.i]=vals(p);sav();upd()}});
app.addEventListener('focusin',function(e){if(e.target.tagName==='TEXTAREA')G.f=e.target.id});
app.addEventListener('click',function(e){var t=e.target.closest('button,.slot');if(!t)return;var d=t.dataset,a=d.a;
if(a==='home')return home();if(a==='pr')return pr(+d.i);if(a==='dec')return dec(+d.i);if(a==='d2'){G.s=2;return decR()}if(a==='dc')return dc();
if(a==='st')return st(+d.i);if(a==='rnd')return st(Math.floor(Math.random()*P.length),1);if(a==='tm')return tm();if(a==='sc')return sc();if(a==='cp')return cpy();
if(a==='ch'){var f=$('#'+(G.f||'f0')),x=P[G.i].ex[+d.k];f.value+=(f.value&&!/\s$/.test(f.value)?' ':'')+x+' ';f.focus();f.dispatchEvent(new Event('input',{bubbles:true}));return}
if(a==='chk')return chk();if(a==='sp'||a==='fx')return qz(a);if(a==='nx'){G.k++;G.ans=null;return qzR()}
if(GYM[a]){var g=GYM[a];return ord(g[Math.floor(Math.random()*g.length)])}
if(d.c){G.cmd=d.c;if(d.c===P[G.i].cmd)add(5);return decR()}
if(d.o!=null){var k=+d.o,j=G.sel.indexOf(k);if(j>-1)G.sel.splice(j,1);else G.sel.push(k);return decR()}
if(d.r){var q=G.q[G.k];G.ans=d.r;if(d.r===q[1]){G.sc++;G.st++;add(2)}else G.st=0;return qzR()}
if(d.p!=null&&G.res!=='ok'){G.pick.push(+d.p);G.res=null;return ordR()}
if(d.s!=null&&G.res!=='ok'){G.pick.splice(+d.s,1);G.res=null;return ordR()}});
home();
</script></body></html>
